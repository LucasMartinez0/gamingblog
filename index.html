<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Blog gaming" />
    <meta
      name="author"
      content="Lucas Martinez, Diego Borgmann, Francisco Diaz, Javier Picuard"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Gaming Blog</title>
  </head>
  <body>
    <header class="container">
      <nav class="navbar navbar-expand-lg navbar-pixel">
        <div class="container">
          <a class="navbar-brand fw-bold pixel" href="index.html"
            >PIXEL<span class="zone navbar-zone">ZONE</span></a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a
                  class="nav-link links"
                  aria-current="page"
                  href="/pages/error404.html"
                  >Inicio</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link links" href="/pages/galeria.html">Galeria</a>
              </li>
              <li class="nav-item">
                <a class="nav-link links" href="">Contacto</a>
              </li>
              <li class="nav-item">
                <a class="nav-link links" href="/pages/acercadenosotros.html"
                  >Acerca de nosotros</a
                >
              </li>
            </ul>
            <button
              class="btn btn-outline-brand me-4 suscription-button button-suscript"
              data-bs-toggle="modal"
              data-bs-target="#suscription"
              type="submit"
            >
              Suscripcion
            </button>
          </div>
          <div
            class="btn log-button button-log"
            data-bs-toggle="modal"
            data-bs-target="#login"
          >
            Login
          </div>
        </div>
        <div
          class="modal fade"
          id="suscription"
          tabindex="-1"
          aria-labelledby="suscriptionLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="suscriptionLabel">
                  Suscribite al blog
                </h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Cerrar"
                ></button>
              </div>

              <div class="modal-body">
                <p>Recibí las novedades gamer en tu correo</p>
                <form>
                  <div class="mb-3">
                    <label for="subEmail" class="form-label">Email<span class="text-danger"> *</span></label>
                    <input
                      type="email"
                      class="form-control"
                      id="subEmail"
                      placeholder="tu@email.com"
                      required
                    />
                  </div>
                  <button type="submit" class="btn btn-primary-brand w-100">
                    Suscribirme
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main></main>
    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
